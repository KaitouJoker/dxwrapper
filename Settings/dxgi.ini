;; ==============================================================================
;; DirectX 11 (DXGI) Low-Latency Proxy Wrapper Configuration
;;
;; Features:
;; - True Hardware: Independent Flip Presentation (DWM Composition Bypass)
;; - Windows Power Throttling / EcoQoS Complete Disabler
;; - Dynamic Sleep Hooking (Eliminate Coarse Sleep / Yield Jitter)
;; - Multimedia Class Scheduler Service (MMCSS) "Games" Thread Elevation
;; - GPU Hardware Queue Latency Minimization (MaxFrameLatency = 1)
;; ==============================================================================

[General]
RealDllPath                 = AUTO
WrapperMode                 = AUTO
LoadCustomDllPath           = 
ExcludeProcess              = 
IncludeProcess              = 
RunProcess                  = 
WaitForProcess              = 0
DisableLogging              = 1

[dxgi]
;; Force swapchain to use DXGI_SWAP_EFFECT_FLIP_DISCARD (Minimum 2 buffers)
ForceFlipModel              = 1

;; Enable DXGI_SWAP_CHAIN_FLAG_ALLOW_TEARING and DXGI_PRESENT_ALLOW_TEARING
;; Required for variable refresh rate (G-Sync/FreeSync) and zero-latency tearing
AllowTearing                = 1

;; Maximum pre-rendered frame queue length (1 = Lowest input lag)
MaxFrameLatency             = 1

;; GPU thread priority level (7 = Real-time priority, range: 0-7)
SetGPUThreadPriority        = 7

[Performance]
;; Intercept Sleep/SleepEx to eliminate thread latency:
;; - Sleep(0) -> YieldProcessor()
;; - Sleep(1..2ms) -> High-precision QueryPerformanceCounter spin-wait
DisableDynamicSleep         = 1

;; Disable Windows EcoQoS / Power Throttling on all process execution threads
DisablePowerThrottling      = 1

;; Elevate render thread priority to THREAD_PRIORITY_TIME_CRITICAL
;; and register thread with MMCSS "Games" profile
BoostRenderThread           = 1

;; Use sub-millisecond QPC spin loop for frame rate pacing
SpinWaitPacing              = 1

;; CPU affinity mask for render thread (0 = default / OS managed)
RenderThreadAffinity        = 0
